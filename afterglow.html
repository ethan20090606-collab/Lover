<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>餘光 - Afterglow BL故事生成器</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    ::selection { background: rgba(232, 166, 108, 0.33); }
    
    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    
    .font-serif { font-family: 'Noto Serif TC', serif; }
    .font-sans { font-family: 'Noto Sans TC', sans-serif; }
    
    .hero-gradient {
      background: linear-gradient(180deg, #3B3160 0%, #6B5A8E 38%, #C97B84 72%, #E8A66C 100%);
    }
    
    .sidebar-scrollable {
      max-height: calc(100vh - 120px);
      overflow-y: auto;
    }
    
    .sidebar-scrollable::-webkit-scrollbar {
      width: 6px;
    }
    
    .sidebar-scrollable::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .sidebar-scrollable::-webkit-scrollbar-thumb {
      background: rgba(155, 138, 166, 0.3);
      border-radius: 3px;
    }
    
    .sidebar-scrollable::-webkit-scrollbar-thumb:hover {
      background: rgba(155, 138, 166, 0.5);
    }
  </style>
</head>
<body class="font-sans" style="background-color: #F7F1E8; color: #2A2432;">
  <div id="root"></div>

  <script>
    const { useState, useEffect, useRef, useCallback } = React;
    const e = React.createElement;

    const STAGE_OPTIONS = [
      { id: "crush", label: "單方暗戀", hint: "一個人偷偷藏著心事" },
      { id: "mutual", label: "互有好感", hint: "曖昧未明,慢慢靠近" },
      { id: "together", label: "已經在一起", hint: "寫日常的溫柔片刻" },
      { id: "rivals", label: "歡喜冤家", hint: "先是拌嘴,後來心動" },
    ];

    const SETTING_OPTIONS = ["校園", "職場", "青梅竹馬", "自訂"];

    const SYSTEM_PROMPT = `你是一位擅長寫BL(男性向愛情)小說的作家,文筆細膩,擅長經營情緒張力與日常感。
規則:
- 使用繁體中文書寫。
- 每次只寫一個章節,篇幅可以視劇情需要發揮,最多不超過5000字,結尾留一點懸念或情緒餘韻,適合連載。
- 絕對不要寫露骨的性愛描寫、身體部位的性化描述、生理細節或體位描述。
- 若劇情走到親密場景,在氣氛與情緒堆疊到位後,用轉場帶過(例如描述到擁抱、親吻、或衣物觸碰後,轉場到隔天清晨、窗外天色、或安靜的擁抱畫面),不要繼續描寫下去。
- 專注在角色的心理狀態、對話、肢體語言的曖昧感、環境氛圍的描寫。
- 只輸出小說正文,不要加標題、不要加任何前言或說明、不要用引號包住整段。`;

    function buildUserPrompt({ nameA, nameB, setting, stageLabel, worldNote, chapters, hint, chapterNum }) {
      const recap =
        chapters.length === 0
          ? "這是故事的第一章,請自然地展開場景與兩人的初次互動氛圍。"
          : `這是第 ${chapterNum} 章。以下是前一章的結尾片段,請自然銜接下去,不要重複已經寫過的內容:\n"""\n${chapters[chapters.length - 1].content.slice(-260)}\n"""`;

      return `角色:${nameA} 與 ${nameB}
故事背景:${setting}
兩人目前的關係階段:${stageLabel}
${worldNote ? `補充設定:${worldNote}` : ""}
${recap}
${hint ? `這一章希望帶到的方向:${hint}` : ""}

請寫出這一章的內容。`;
    }

    async function callClaude(system, user) {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 8000,
          system,
          messages: [{ role: "user", content: user }],
        }),
      });
      if (!response.ok) throw new Error("API 請求失敗");
      const data = await response.json();
      const text = (data.content || [])
        .map((b) => (b.type === "text" ? b.text : ""))
        .filter(Boolean)
        .join("\n")
        .trim();
      if (!text) throw new Error("沒有收到內容");
      return text;
    }

    function SunsetDivider() {
      return e('div', { className: "flex items-center gap-3 my-8 select-none" },
        e('div', { className: "h-px flex-1 bg-gradient-to-r from-transparent via-[#C97B84]/40 to-transparent" }),
        e('span', { className: "text-[11px] tracking-[0.3em] text-[#9B8AA6] font-sans" }, "放 學 之 後"),
        e('div', { className: "h-px flex-1 bg-gradient-to-r from-transparent via-[#C97B84]/40 to-transparent" })
      );
    }

    function Loading({ label }) {
      return e('div', { className: "flex items-center gap-2 text-[#9B8AA6] text-sm font-sans" },
        e('span', { className: "relative flex h-2 w-2" },
          e('span', { className: "animate-ping absolute inline-flex h-full w-full rounded-full bg-[#C97B84] opacity-60" }),
          e('span', { className: "relative inline-flex rounded-full h-2 w-2 bg-[#C97B84]" })
        ),
        label
      );
    }

    function Afterglow() {
      const [stories, setStories] = useState([]);
      const [currentStoryId, setCurrentStoryId] = useState(null);
      const [view, setView] = useState("loading");
      const [setupMode, setSetupMode] = useState("new");
      const [formData, setFormData] = useState({
        nameA: "",
        nameB: "",
        settingChoice: "校園",
        settingCustom: "",
        stageId: "mutual",
        worldNote: "",
      });
      const [hint, setHint] = useState("");
      const [generating, setGenerating] = useState(false);
      const [error, setError] = useState("");
      const [toast, setToast] = useState("");
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const bottomRef = useRef(null);

      const currentStory = stories.find((s) => s.id === currentStoryId);

      useEffect(() => {
        (async () => {
          try {
            const stored = await window.storage.get("afterglow-stories", false);
            if (stored) {
              const parsed = JSON.parse(stored.value);
              setStories(parsed);
              if (parsed.length > 0) {
                setCurrentStoryId(parsed[0].id);
                setView("reading");
              } else {
                setView("list");
              }
              return;
            }
          } catch (e) {
            console.error("讀取失敗", e);
          }
          setView("list");
        })();
      }, []);

      useEffect(() => {
        if (toast) {
          const t = setTimeout(() => setToast(""), 1800);
          return () => clearTimeout(t);
        }
      }, [toast]);

      const persistStories = useCallback(async (updated) => {
        try {
          await window.storage.set("afterglow-stories", JSON.stringify(updated), false);
        } catch (e) {
          console.error("儲存失敗", e);
        }
      }, []);

      const updateCurrentStory = useCallback(
        (updates) => {
          const idx = stories.findIndex((s) => s.id === currentStoryId);
          if (idx === -1) return;
          const updated = [...stories];
          updated[idx] = { ...updated[idx], ...updates };
          setStories(updated);
          persistStories(updated);
        },
        [stories, currentStoryId, persistStories]
      );

      const startStory = async () => {
        if (!formData.nameA.trim() || !formData.nameB.trim()) {
          setError("請先幫兩位主角取名字。");
          return;
        }
        setError("");
        setGenerating(true);

        try {
          const settingLabel = formData.settingChoice === "自訂" ? formData.settingCustom : formData.settingChoice;
          const stageLabel = STAGE_OPTIONS.find((s) => s.id === formData.stageId)?.label || "";

          const user = buildUserPrompt({
            nameA: formData.nameA,
            nameB: formData.nameB,
            setting: settingLabel,
            stageLabel,
            worldNote: formData.worldNote,
            chapters: [],
            hint: "",
            chapterNum: 1,
          });
          const content = await callClaude(SYSTEM_PROMPT, user);
          const first = [{ id: Date.now(), title: "第一章", content }];

          const newStory = {
            id: Date.now(),
            nameA: formData.nameA,
            nameB: formData.nameB,
            settingChoice: formData.settingChoice,
            settingCustom: formData.settingCustom,
            stageId: formData.stageId,
            worldNote: formData.worldNote,
            chapters: first,
            createdAt: new Date().toISOString(),
          };

          const updated = [...stories, newStory];
          setStories(updated);
          setCurrentStoryId(newStory.id);
          persistStories(updated);

          setFormData({
            nameA: "",
            nameB: "",
            settingChoice: "校園",
            settingCustom: "",
            stageId: "mutual",
            worldNote: "",
          });
          setView("reading");
        } catch (e) {
          setError("生成失敗,請再試一次。");
          console.error(e);
        } finally {
          setGenerating(false);
        }
      };

      const nextChapter = async () => {
        if (!currentStory) return;
        setGenerating(true);
        setError("");

        try {
          const settingLabel = currentStory.settingChoice === "自訂" ? currentStory.settingCustom : currentStory.settingChoice;
          const stageLabel = STAGE_OPTIONS.find((s) => s.id === currentStory.stageId)?.label || "";

          const user = buildUserPrompt({
            nameA: currentStory.nameA,
            nameB: currentStory.nameB,
            setting: settingLabel,
            stageLabel,
            worldNote: currentStory.worldNote,
            chapters: currentStory.chapters,
            hint,
            chapterNum: currentStory.chapters.length + 1,
          });
          const content = await callClaude(SYSTEM_PROMPT, user);
          const newChapters = [
            ...currentStory.chapters,
            { id: Date.now(), title: `第${currentStory.chapters.length + 1}章`, content }
          ];

          updateCurrentStory({ chapters: newChapters });
          setHint("");
          setTimeout(() => bottomRef.current?.scrollIntoView({ behavior: "smooth" }), 100);
        } catch (e) {
          setError("生成失敗,請再試一次。");
          console.error(e);
        } finally {
          setGenerating(false);
        }
      };

      const regenerateLast = async () => {
        if (!currentStory || currentStory.chapters.length === 0) return;
        setGenerating(true);
        setError("");

        try {
          const settingLabel = currentStory.settingChoice === "自訂" ? currentStory.settingCustom : currentStory.settingChoice;
          const stageLabel = STAGE_OPTIONS.find((s) => s.id === currentStory.stageId)?.label || "";

          const priorChapters = currentStory.chapters.slice(0, -1);
          const user = buildUserPrompt({
            nameA: currentStory.nameA,
            nameB: currentStory.nameB,
            setting: settingLabel,
            stageLabel,
            worldNote: currentStory.worldNote,
            chapters: priorChapters,
            hint,
            chapterNum: currentStory.chapters.length,
          });
          const content = await callClaude(SYSTEM_PROMPT, user);
          const updated = [
            ...priorChapters,
            { id: Date.now(), title: currentStory.chapters[currentStory.chapters.length - 1].title, content }
          ];

          updateCurrentStory({ chapters: updated });
        } catch (e) {
          setError("重新生成失敗,請再試一次。");
          console.error(e);
        } finally {
          setGenerating(false);
        }
      };

      const deleteStory = (storyId) => {
        const updated = stories.filter((s) => s.id !== storyId);
        setStories(updated);
        persistStories(updated);
        if (currentStoryId === storyId) {
          setCurrentStoryId(updated.length > 0 ? updated[0].id : null);
          setView(updated.length > 0 ? "reading" : "list");
        }
      };

      const copyAll = async () => {
        if (!currentStory) return;
        const full = currentStory.chapters.map((c) => `${c.title}\n\n${c.content}`).join("\n\n\n");
        try {
          await navigator.clipboard.writeText(full);
          setToast("已複製全文");
        } catch (e) {
          setToast("複製失敗");
        }
      };

      return e('div', { className: "min-h-screen w-full flex" },
        // 側邊欄
        e('div', {
          className: `fixed inset-y-0 left-0 z-50 w-80 transition-transform duration-300 ${sidebarOpen ? "translate-x-0" : "-translate-x-full"} lg:relative lg:translate-x-0`,
          style: { background: "#F7F1E8", borderRight: "1px solid rgba(155, 138, 166, 0.2)" }
        },
          e('div', { className: "flex flex-col h-full" },
            // 側邊欄頭部
            e('div', { className: "p-4 border-b border-[#9B8AA6]/20" },
              e('div', { className: "flex items-center justify-between mb-3" },
                e('h2', { className: "font-serif font-bold text-[#3B3160]" }, "故事列表"),
                e('button', {
                  onClick: () => setSidebarOpen(false),
                  className: "lg:hidden text-[#9B8AA6] hover:text-[#3B3160]"
                }, "✕")
              ),
              e('button', {
                onClick: () => setView("list"),
                className: "w-full text-sm py-2 bg-[#3B3160] text-white rounded-lg hover:opacity-90 transition"
              }, "+ 新故事")
            ),
            // 故事列表
            e('div', { className: "sidebar-scrollable flex-1 px-3 py-2" },
              stories.length === 0
                ? e('p', { className: "text-xs text-[#9B8AA6] text-center py-4" }, "還沒有故事")
                : stories.map((story) =>
                    e('div', {
                      key: story.id,
                      onClick: () => {
                        setCurrentStoryId(story.id);
                        setView("reading");
                        setSidebarOpen(false);
                      },
                      className: `p-3 mb-2 rounded-lg cursor-pointer transition ${
                        currentStoryId === story.id
                          ? "bg-[#C97B84]/15 border border-[#C97B84]"
                          : "bg-white/50 border border-[#9B8AA6]/15 hover:border-[#9B8AA6]/40"
                      }`
                    },
                      e('div', { className: "text-sm font-serif font-bold text-[#3B3160]" }, `${story.nameA} × ${story.nameB}`),
                      e('div', { className: "text-xs text-[#9B8AA6] mt-1" }, `${story.chapters.length}章`),
                      e('button', {
                        onClick: (ev) => {
                          ev.stopPropagation();
                          deleteStory(story.id);
                        },
                        className: "text-[10px] text-[#C97B84]/60 hover:text-[#C97B84] mt-2"
                      }, "刪除")
                    )
                  )
            ),
            // 側邊欄底部
            e('div', { className: "p-3 border-t border-[#9B8AA6]/20 text-[10px] text-[#9B8AA6]/60 text-center" },
              "親密場景以氛圍轉場帶過"
            )
          )
        ),

        // 主內容區
        e('div', { className: "flex-1 overflow-hidden" },
          e('div', { className: "flex items-center gap-2 lg:hidden p-4 bg-white/30" },
            e('button', {
              onClick: () => setSidebarOpen(true),
              className: "text-[#3B3160] hover:text-[#C97B84]"
            }, "☰")
          ),

          view === "loading"
            ? e('div', { className: "flex justify-center items-center h-screen" },
                e(Loading, { label: "正在翻開故事⋯" })
              )
            : view === "list"
            ? e('div', { className: "max-w-2xl mx-auto px-6 py-12" },
                e('div', { className: "hero-gradient rounded-2xl p-12 text-center mb-8" },
                  e('p', { className: "text-[11px] tracking-[0.4em] text-[#F7F1E8]/70 mb-3 font-sans" }, "A F T E R G L O W"),
                  e('h1', { className: "text-5xl font-serif font-black text-[#F7F1E8] mb-4" }, "餘光"),
                  e('p', { className: "text-[#F7F1E8]/80 text-sm leading-relaxed" },
                    "放學鐘聲響過之後,走廊剩下的光,總是留給還沒說出口的話。\n寫一段屬於你們兩個人的故事。"
                  )
                ),
                e('div', { className: "bg-white/60 backdrop-blur rounded-2xl border border-[#9B8AA6]/20 p-8 shadow-lg" },
                  e('h2', { className: "font-serif text-xl font-bold text-[#3B3160] mb-1" }, "設定你們的故事"),
                  e('p', { className: "text-xs text-[#9B8AA6] mb-6" }, "填好之後,故事會從這裡開始寫起。"),

                  e('div', { className: "grid grid-cols-2 gap-3 mb-5" },
                    e('div', {},
                      e('label', { className: "block text-xs text-[#9B8AA6] mb-1.5" }, "角色一"),
                      e('input', {
                        value: formData.nameA,
                        onChange: (ev) => setFormData({ ...formData, nameA: ev.target.value }),
                        placeholder: "例如:陸則安",
                        className: "w-full rounded-lg border border-[#9B8AA6]/30 bg-white/80 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#C97B84]/50"
                      })
                    ),
                    e('div', {},
                      e('label', { className: "block text-xs text-[#9B8AA6] mb-1.5" }, "角色二"),
                      e('input', {
                        value: formData.nameB,
                        onChange: (ev) => setFormData({ ...formData, nameB: ev.target.value }),
                        placeholder: "例如:林亦修",
                        className: "w-full rounded-lg border border-[#9B8AA6]/30 bg-white/80 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#C97B84]/50"
                      })
                    )
                  ),

                  e('div', { className: "mb-5" },
                    e('label', { className: "block text-xs text-[#9B8AA6] mb-1.5" }, "故事背景"),
                    e('div', { className: "flex flex-wrap gap-2 mb-2" },
                      SETTING_OPTIONS.map((s) =>
                        e('button', {
                          key: s,
                          onClick: () => setFormData({ ...formData, settingChoice: s }),
                          className: `px-3 py-1.5 rounded-full text-xs border transition-colors ${
                            formData.settingChoice === s
                              ? "bg-[#3B3160] text-white border-[#3B3160]"
                              : "bg-white/70 text-[#3B3160] border-[#9B8AA6]/30 hover:border-[#9B8AA6]/60"
                          }`
                        }, s)
                      )
                    ),
                    formData.settingChoice === "自訂" && e('input', {
                      value: formData.settingCustom,
                      onChange: (ev) => setFormData({ ...formData, settingCustom: ev.target.value }),
                      placeholder: "描述你想要的場景",
                      className: "w-full rounded-lg border border-[#9B8AA6]/30 bg-white/80 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#C97B84]/50"
                    })
                  ),

                  e('div', { className: "mb-5" },
                    e('label', { className: "block text-xs text-[#9B8AA6] mb-1.5" }, "關係階段"),
                    e('div', { className: "grid grid-cols-2 gap-2" },
                      STAGE_OPTIONS.map((s) =>
                        e('button', {
                          key: s.id,
                          onClick: () => setFormData({ ...formData, stageId: s.id }),
                          className: `text-left px-3 py-2 rounded-lg border text-xs transition-colors ${
                            formData.stageId === s.id
                              ? "bg-[#C97B84]/15 border-[#C97B84] text-[#3B3160]"
                              : "bg-white/70 border-[#9B8AA6]/30 text-[#3B3160]/70 hover:border-[#9B8AA6]/60"
                          }`
                        },
                          e('div', { className: "font-medium" }, s.label),
                          e('div', { className: "text-[10px] opacity-70 mt-0.5" }, s.hint)
                        )
                      )
                    )
                  ),

                  e('div', { className: "mb-6" },
                    e('label', { className: "block text-xs text-[#9B8AA6] mb-1.5" }, "補充設定(選填)"),
                    e('textarea', {
                      value: formData.worldNote,
                      onChange: (ev) => setFormData({ ...formData, worldNote: ev.target.value }),
                      placeholder: "例如:兩人是圖書委員,常在放學後留下來整理書架",
                      rows: 2,
                      className: "w-full rounded-lg border border-[#9B8AA6]/30 bg-white/80 px-3 py-2 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-[#C97B84]/50"
                    })
                  ),

                  error && e('p', { className: "text-xs text-[#C97B84] mb-3" }, error),

                  e('button', {
                    onClick: startStory,
                    disabled: generating,
                    className: "w-full rounded-lg py-3 text-sm font-medium text-white transition-opacity disabled:opacity-60",
                    style: { background: "linear-gradient(90deg, #3B3160, #C97B84)" }
                  }, generating ? "正在寫下第一章⋯" : "開始故事")
                )
              )
            : view === "reading" && currentStory
            ? e('div', { className: "max-w-xl mx-auto px-6 py-10 h-screen overflow-y-auto" },
                e('div', { className: "flex items-center justify-between mb-6" },
                  e('div', {},
                    e('p', { className: "text-xs text-[#9B8AA6]" },
                      `${currentStory.nameA} × ${currentStory.nameB}`
                    )
                  ),
                  e('div', { className: "flex gap-2" },
                    e('button', {
                      onClick: copyAll,
                      className: "text-[11px] text-[#3B3160]/70 border border-[#9B8AA6]/30 rounded-full px-3 py-1 hover:border-[#9B8AA6]/60"
                    }, "複製全文")
                  )
                ),

                e('div', { className: "space-y-2" },
                  currentStory.chapters.map((ch, i) =>
                    e('div', { key: ch.id },
                      i > 0 && e(SunsetDivider),
                      e('div', { className: "bg-white/60 rounded-xl border border-[#9B8AA6]/15 p-6 shadow-lg" },
                        e('h3', { className: "font-serif text-[#3B3160] font-bold mb-3 text-sm tracking-wide" }, ch.title),
                        e('p', { className: "whitespace-pre-wrap leading-[1.9] text-[15px] text-[#2A2432] font-serif" }, ch.content)
                      )
                    )
                  )
                ),

                e('div', { ref: bottomRef }),

                error && e('p', { className: "text-xs text-[#C97B84] mt-4 text-center" }, error),

                e('div', { className: "mt-8 bg-white/50 rounded-xl border border-[#9B8AA6]/15 p-5 mb-4" },
                  e('label', { className: "block text-xs text-[#9B8AA6] mb-1.5" }, "下一章想帶到哪裡?(選填)"),
                  e('input', {
                    value: hint,
                    onChange: (ev) => setHint(ev.target.value),
                    placeholder: "例如:讓其中一人先察覺自己的心意",
                    className: "w-full rounded-lg border border-[#9B8AA6]/30 bg-white/80 px-3 py-2 text-sm mb-3 focus:outline-none focus:ring-2 focus:ring-[#C97B84]/50"
                  }),
                  e('div', { className: "flex gap-2" },
                    e('button', {
                      onClick: nextChapter,
                      disabled: generating,
                      className: "flex-1 rounded-lg py-2.5 text-sm font-medium text-white disabled:opacity-60",
                      style: { background: "linear-gradient(90deg, #3B3160, #C97B84)" }
                    }, generating ? "下筆中⋯" : "繼續下一章"),
                    e('button', {
                      onClick: regenerateLast,
                      disabled: generating || currentStory.chapters.length === 0,
                      className: "rounded-lg px-4 py-2.5 text-sm border border-[#9B8AA6]/30 text-[#3B3160] disabled:opacity-50"
                    }, "重寫這章")
                  )
                )
              )
            : null
        ),

        // Toast
        toast && e('div', { className: "fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#3B3160] text-white text-xs px-4 py-2 rounded-full shadow-lg" },
          toast
        )
      );
    }

    // 渲染應用
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(Afterglow));
  </script>
</body>
</html>
